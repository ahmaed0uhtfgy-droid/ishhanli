name = "ishhanli"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

[vars]
FIREBASE_PROJECT_ID = "ishhanli"
# ⚠️ السر الوحيد على السيرفر — مش هنا ومش في GitHub! بيتحط من لوحة Cloudflare:
#   Workers & Pages → ishhanli → Settings → Variables and Secrets → Add → Type: Secret
#   الاسم: FIREBASE_SERVICE_ACCOUNT   القيمة: محتوى ملف JSON كامل (Firebase → Project settings → Service accounts → Generate new private key)
# اختياري: PUSH_DISABLED = "1" بيوقف الإشعارات من غير ما يأثر على باقي الموقع.
# اختياري: SETTINGS_TTL_MS (افتراضي 15000) = مدة تخزين الإعدادات في ذاكرة السيرفر لتوفير القراءات.
